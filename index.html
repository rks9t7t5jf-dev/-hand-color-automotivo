<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hand Color Automotivo</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
h2{margin:20px 0}
#camera{width:100%;height:55vh;object-fit:cover}
.mira{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);
width:170px;height:170px;border:3px solid white;border-radius:50%}
button{margin:12px;padding:16px 25px;border:0;border-radius:12px;
font-size:17px;font-weight:bold}
#cor{width:70px;height:70px;border-radius:15px;margin:15px auto;
border:2px solid white}
#resultado{font-size:20px}
</style>
</head>

<body>

<h2>🎨 HAND COLOR AUTOMOTIVO</h2>

<div style="position:relative">
<video id="camera" autoplay playsinline></video>
<div class="mira"></div>
</div>

<button onclick="lerCor()">CAPTURAR COR</button>

<div id="cor"></div>
<div id="resultado">Aponte para a pintura</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const video=document.getElementById("camera");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({
 video:{facingMode:"environment"},
 audio:false
})
.then(stream=>{
 video.srcObject=stream;
})
.catch(()=>{
 document.getElementById("resultado").innerText=
 "Permita o acesso à câmera.";
});

function lerCor(){

 canvas.width=40;
 canvas.height=40;

 ctx.drawImage(
   video,
   video.videoWidth/2-20,
   video.videoHeight/2-20,
   40,40,0,0,40,40
 );

 let dados=ctx.getImageData(0,0,40,40).data;

 let r=0,g=0,b=0,n=0;

 for(let i=0;i<dados.length;i+=4){
   r+=dados[i];
   g+=dados[i+1];
   b+=dados[i+2];
   n++;
 }

 r=Math.round(r/n);
 g=Math.round(g/n);
 b=Math.round(b/n);

 let hex="#"+
 [r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();

 document.getElementById("cor").style.background=hex;

 document.getElementById("resultado").innerHTML=
 "Cor aproximada<br><b>"+hex+"</b><br>"+
 "RGB: "+r+" / "+g+" / "+b;
}
</script>

</body>
</html>
